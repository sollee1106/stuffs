:root{
  color-scheme:light;
  --page:#F1F3F4; --surface:#FFFFFF; --surface-2:#F5F6F7;
  --ink:#16191D; --ink-2:#4B525A; --muted:#757D85;
  --line:#E0E4E8; --line-strong:#C3C9CF;
  --accent:#1F5FC4; --accent-ink:#FFFFFF; --accent-soft:#E4ECFA;
  --chart:#2a78d6; --tm:#8A9199; --grid:#E6E9EC;
  --good:#167A44; --good-fill:#1E9A4B; --good-soft:#E1F2E8;
  --pr:#F2B705; --pr-ink:#16191D; --danger:#B8322D;
  --p55:#D3312F; --p45:#1F5FC4; --p35:#F2B705; --p25:#1E9A4B; --p10:#F7F7F5; --p5:#8A9199; --p2:#5F666E; --sleeve:#A9AFB5;
  --font-num:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#17191C; --surface:#212428; --surface-2:#2A2E33;
    --ink:#EEF0F2; --ink-2:#B9BFC6; --muted:#8C949C;
    --line:#32373D; --line-strong:#454B52;
    --accent:#3B7FE8; --accent-ink:#FFFFFF; --accent-soft:#1F2F4A;
    --chart:#4a8ef0; --tm:#8C949C; --grid:#2E3237;
    --good:#3CC274; --good-fill:#1E9A4B; --good-soft:#1C3527;
    --danger:#F0716B; --p10:#E9E9E6; --sleeve:#6E757C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#17191C; --surface:#212428; --surface-2:#2A2E33;
  --ink:#EEF0F2; --ink-2:#B9BFC6; --muted:#8C949C;
  --line:#32373D; --line-strong:#454B52;
  --accent:#3B7FE8; --accent-ink:#FFFFFF; --accent-soft:#1F2F4A;
  --chart:#4a8ef0; --tm:#8C949C; --grid:#2E3237;
  --good:#3CC274; --good-fill:#1E9A4B; --good-soft:#1C3527;
  --danger:#F0716B; --p10:#E9E9E6; --sleeve:#6E757C;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:680px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 18px 0}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-num);font-weight:700;font-size:19px;color:var(--ink);text-decoration:none;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand svg{flex:none}
.sync-pill{display:none;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
.sync-pill.show{display:flex}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good-fill)} .dot.err{background:var(--danger)} .dot.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

main.app{max-width:680px;margin:0 auto;padding:6px 14px calc(100px + env(safe-area-inset-bottom))}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar nav{display:flex;max-width:520px;margin:0 auto}
.tabbar a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 3px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;border-radius:12px}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .badge-dot{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--danger);display:none}
.tabbar .badge-dot.show{display:block}

/* shared */
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:none;border-color:transparent;color:var(--ink-2);padding:0 10px}
.btn.danger{color:var(--danger)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.link-btn{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:6px 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.empty{color:var(--ink-2);font-size:15px;padding:18px 4px;text-align:center}
.muted{color:var(--muted)}

/* train: week header */
.week-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:10px 0 14px}
.week-title{text-align:center;min-width:0}
.cycle-line{font-family:var(--font-num);font-weight:700;font-size:44px;line-height:.95;letter-spacing:-.01em}
.week-line{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;font-family:var(--font-num);font-weight:600;font-size:22px;color:var(--ink-2)}
.scheme{background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:0 8px;font-size:19px;line-height:1.35}
.dates{font-size:13px;color:var(--muted);margin-top:3px}
.back-next{text-align:center;margin:-6px 0 10px}

/* train: sessions */
.session{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.session.is-next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.session-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 12px;width:100%;text-align:left;background:none;border:0;padding:14px 16px}
.lift-name{font-family:var(--font-num);font-weight:700;font-size:27px;line-height:1.05}
.session-sub{font-size:13px;color:var(--muted);margin-top:2px}
.session-sub b{color:var(--ink-2);font-weight:600}
.session-sub .sum{margin-left:10px;white-space:nowrap}
.head-right{display:flex;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tag.next{background:var(--accent);color:var(--accent-ink)}
.tag.done{background:var(--good-soft);color:var(--good)}
.chev{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease}
.session.open .chev{transform:rotate(180deg)}
.session-body{display:none;padding:0 16px 16px}
.session.open .session-body{display:block}
.tm-line{font-size:13px;color:var(--muted);margin:-2px 0 8px}

.sets{border-top:1px solid var(--line)}
.group-label{font-size:12px;font-weight:600;color:var(--muted);padding:10px 0 0}
.set-row{display:grid;grid-template-columns:38px auto 1fr;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line-strong);background:none;display:grid;place-items:center;padding:0;color:transparent}
.set-check svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.set-check[aria-pressed="true"]{background:var(--good-fill);border-color:var(--good-fill);color:#fff}
.set-w{font-family:var(--font-num);font-weight:700;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.set-w .x{font-weight:600;font-size:23px;color:var(--ink-2);margin:0 1px 0 7px}
.set-w .plus{color:var(--accent)}
.set-pct{display:block;font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted);margin-top:4px;letter-spacing:0}
.set-row.warm .set-w{font-size:26px;color:var(--ink-2)}
.set-row.warm .set-w .x{font-size:18px}
.plates{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
.plates svg{display:block;max-width:100%}
.ptext{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.amrap{margin-top:14px;padding:14px;border-radius:14px;background:var(--surface-2)}

input.field.wide{width:min(220px,52vw)}

  *,*::before,*::after{transition:none!important;animation:none!important}

<script>
'use strict';
/* ============================================================
   5/3/1 Tracker
   Program math follows Jon K's "Wendler 5/3/1 Spreadsheet v1.3":
   - training max (TM) = estimated 1RM x TM% (90%), +increment each 4-week cycle
   - week %s of TM: 65/75/85, 70/80/90, 75/85/95, deload 40/50/60
   - weights rounded to the nearest increment (MROUND)
   - estimated 1RM from AMRAP set: Brzycki, w / (1.0278 - 0.0278 x reps)
   - Boring But Big at BBB% of TM
   ============================================================ */

const LS_STATE = 't531.state.v1';
const LS_SYNC  = 't531.sync.v1';
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WEEKS = [
  { n:1, label:'5s',     pcts:[0.65,0.75,0.85], reps:[5,5,5], amrap:true  },
  { n:2, label:'3s',     pcts:[0.70,0.80,0.90], reps:[3,3,3], amrap:true  },
  { n:3, label:'5/3/1',  pcts:[0.75,0.85,0.95], reps:[5,3,1], amrap:true  },
  { n:4, label:'Deload', pcts:[0.40,0.50,0.60], reps:[5,5,5], amrap:false },
];
const WARMUP = { pcts:[0.40,0.50,0.60], reps:[5,5,3] };
const PLATE_DEFAULTS = { lbs:[45,35,25,10,5,2.5], kg:[25,20,15,10,5,2.5,1.25] };
const BAR_DEFAULTS = { lbs:45, kg:20 };
const ROUND_DEFAULTS = { lbs:5, kg:2.5 };

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n == null || !isFinite(n)) ? '–' : String(Math.round(n * 100) / 100);
const r0 = n => (n == null || !isFinite(n)) ? '–' : String(Math.round(n));
const key = (id, c, w) => `${id}|${c}|${w}`;
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { if (v === '' || v == null) return null; const n = Number(v); return isFinite(n) ? n : null; };
const ICON = {
  check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  left:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
};

function mround(x, step) {
  if (!(step > 0)) return Math.round(x * 100) / 100;
  return Math.round(Math.round(x / step + 1e-9) * step * 1000) / 1000;
}
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseISO(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date();
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDate(d, opts = {}) {
  const o = { weekday: opts.noWeekday ? undefined : 'short', month: 'short', day: 'numeric' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('en-US', o);
}
function ago(t) {
  if (!t) return 'never';
  const s = (Date.now() - t) / 1000;
  if (s < 45) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

/* ---------- seed: data from the Google Sheet ---------- */
function baseState() {
  return {
    v: 1,
    updatedAt: 0,
    t: { settings: 0, lifts: 0, tm: 0, bw: 0 },
    settings: {
      title: 'Bigger Sol 2026',
      unit: 'lbs', bar: 45, round: 5,
      tmPct: 0.9, bbbPct: 0.5,
      start: '2016-08-23',
      formula: 'brzycki',
      warmups: false, plateViz: true,
      plates: [45, 35, 25, 10, 5, 2.5],
      cycles: 13,
      theme: 'auto',
    },
    lifts: [
      { id: 'squat',    name: 'Squat',          dow: 2, w: 290, r: 1, inc: 10, bbbSets: 5, bbbReps: 10, bbbDeload: 3 },
      { id: 'bench',    name: 'Bench press',    dow: 3, w: 240, r: 1, inc: 5,  bbbSets: 5, bbbReps: 10, bbbDeload: 3 },
      { id: 'deadlift', name: 'Deadlift',       dow: 4, w: 330, r: 1, inc: 10, bbbSets: 5, bbbReps: 8,  bbbDeload: 3 },
      { id: 'press',    name: 'Shoulder press', dow: 5, w: 130, r: 1, inc: 5,  bbbSets: 5, bbbReps: 10, bbbDeload: 3 },
    ],
    tm: {},
    bw: {},
    log: {},
  };
}
function makeSeed() {
  const s = baseState();
  s.bw = { '1': 180, '2': 300 };
  const reps = {                       // AMRAP reps on "PR: Set 3", weeks 1-3, per cycle
    squat:    [[5,3,4],[null,4,5],[3,3,3],[5,3,2],[5,3,2],[5,3,3]],
    bench:    [[7]],
    deadlift: [[5,5]],
  };
  for (const [id, cycles] of Object.entries(reps)) {
    const lift = s.lifts.find(l => l.id === id);
    cycles.forEach((wk, ci) => wk.forEach((r, wi) => {
      if (r == null) return;
      s.log[key(id, ci + 1, wi + 1)] = { reps: r, done: true, w: setWeights(s, lift, ci + 1, wi + 1)[2], t: 0 };
    }));
  }
  return s;
}
function normalize(d) {
  const b = baseState();
  const s = Object.assign({}, b, d);
  s.settings = Object.assign({}, b.settings, d.settings || {});
  s.t = Object.assign({}, b.t, d.t || {});
  s.lifts = (Array.isArray(d.lifts) && d.lifts.length ? d.lifts : b.lifts)
    .map((l, i) => Object.assign({}, b.lifts[i] || b.lifts[0], { id: 'lift' + i }, l));
  s.tm = d.tm && typeof d.tm === 'object' ? d.tm : {};
  s.bw = d.bw && typeof d.bw === 'object' ? d.bw : {};
  s.log = d.log && typeof d.log === 'object' ? d.log : {};
  if (!Array.isArray(s.settings.plates)) s.settings.plates = PLATE_DEFAULTS[s.settings.unit] || PLATE_DEFAULTS.lbs;
  return s;
}
function validShape(d) { return d && typeof d === 'object' && Array.isArray(d.lifts) && d.settings && typeof d.settings === 'object'; }

/* ---------- program math ---------- */
function e1rm(w, r, formula) {
  if (w == null || r == null || !(r >= 1)) return null;
  if (r === 1) return w;
  if (formula === 'epley') return w * (1 + r / 30);
  return w / (1.0278 - 0.0278 * Math.min(r, 36));
}
function tmFor(st, lift, c) {
  let tm = (e1rm(+lift.w, +lift.r || 1, st.settings.formula) || 0) * (+st.settings.tmPct || 0.9);
  for (let i = 1; i <= c; i++) {
    const o = st.tm[`${lift.id}|${i}`];
    if (o != null && o !== '') tm = +o;
    else if (i > 1) tm += (+lift.inc || 0);
  }
  return tm;
}
function setWeights(st, lift, c, w) {
  const tm = tmFor(st, lift, c), step = +st.settings.round;
  return WEEKS[w - 1].pcts.map(p => mround(tm * p, step));
}
function bbbWeight(st, lift, c) { return mround(tmFor(st, lift, c) * (+st.settings.bbbPct || 0), +st.settings.round); }
function dayOffset(lift) {
  const sd = parseISO(S.settings.start).getDay();
  return (((+lift.dow - sd) % 7) + 7) % 7;
}
function sessionDate(lift, c, w) { return addDays(parseISO(S.settings.start), (c - 1) * 28 + (w - 1) * 7 + dayOffset(lift)); }
function liftsOrdered() {
  return S.lifts.map((l, i) => ({ l, i })).sort((a, b) => dayOffset(a.l) - dayOffset(b.l) || a.i - b.i).map(x => x.l);
}
function isLogged(e) { return !!e && (!!e.done || (e.reps != null && e.reps !== '')); }
function sequence() {
  const out = [], lifts = liftsOrdered();
  for (let c = 1; c <= S.settings.cycles; c++) for (let w = 1; w <= 4; w++) for (const lift of lifts) out.push({ c, w, lift });
  return out;
}
function upNext() {
  const seq = sequence();
  let last = -1;
  seq.forEach((s, i) => { if (isLogged(S.log[key(s.lift.id, s.c, s.w)])) last = i; });
  return seq[last + 1] || null;
}
function topWeight(lift, c, w) { const e = S.log[key(lift.id, c, w)]; return (e && e.w != null) ? +e.w : setWeights(S, lift, c, w)[2]; }
function entryE1(lift, c, w) {
  const e = S.log[key(lift.id, c, w)];
  if (!e || e.reps == null || e.reps === '' || w > 3) return null;
  return e1rm(topWeight(lift, c, w), +e.reps, S.settings.formula);
}
function bestBefore(lift, c, w) {
  let best = null;
  for (let ci = 1; ci <= c; ci++) for (let wi = 1; wi <= 3; wi++) {
    if (ci === c && wi >= w) break;
    const v = entryE1(lift, ci, wi);
    if (v != null && (best == null || v > best)) best = v;
  }
  return best;
}
function repsToBeat(weight, best) {
  if (best == null) return null;
  for (let r = 1; r <= 30; r++) if (e1rm(weight, r, S.settings.formula) > best + 1e-6) return r;
  return null;
}
function platesFor(weight) {
  const bar = +S.settings.bar || 0;
  const plates = [...(S.settings.plates || [])].map(Number).filter(p => p > 0).sort((a, b) => b - a);
  let side = (weight - bar) / 2;
  if (side < -1e-6) return { below: true, list: [], rem: 0 };
  const list = [];
  for (const p of plates) { while (side >= p - 1e-6) { list.push(p); side -= p; } }
  return { below: false, list, rem: Math.round(side * 1000) / 1000 };
}

/* ---------- state + persistence ---------- */
let S = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(LS_STATE);
    if (raw) { const d = JSON.parse(raw); if (validShape(d)) return normalize(d); }
  } catch (e) { /* storage unavailable: run in memory */ }
  return makeSeed();
}
function persist() {
  try { localStorage.setItem(LS_STATE, JSON.stringify(S)); }
  catch (e) { toast('Could not save on this device. Export a backup from Settings.'); }
}
function commit(section, opts = {}) {
  const now = Date.now();
  if (section) S.t[section] = now;
  S.updatedAt = now;
  persist();
  if (!opts.silent) requestRender();
  Sync.schedule();
}
function updateEntry(k, fn) {
  const e = Object.assign({}, S.log[k] || {});
  fn(e);
  e.t = Date.now();
  S.log[k] = e;
  commit(null);
}

/* ---------- UI state ---------- */
const ui = { tab: 'train', week: null, open: new Set(), openFor: null, planC: null, lift: null, pending: false };
const app = $('#app');

function requestRender() {
  if (ui.pending) return;
  ui.pending = true;
  setTimeout(() => { ui.pending = false; render(); }, 0);
}
function render() {
  const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  applyTheme();
  $('#brand-title').textContent = S.settings.title || '5/3/1';
  document.querySelectorAll('.tabbar a').forEach(a => { if (a.dataset.tab === ui.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const views = { train: viewTrain, plan: viewPlan, progress: viewProgress, settings: viewSettings };
  app.innerHTML = (views[ui.tab] || viewTrain)();
  if (ui.tab === 'progress') drawChart();
  updateSyncIndicator();
  if (fid) { const el = app.querySelector(`[data-fid="${CSS.escape(fid)}"]`); if (el) el.focus({ preventScroll: true }); }
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
let toastTimer;
function toast(msg, kind) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast' + (kind ? ' ' + kind : ''); }, 2800);
}

/* ---------- plate diagram ---------- */
function plateStyle(p) {
  const lbs = S.settings.unit !== 'kg';
  const L = { 55:['--p55',34,8], 45:['--p45',34,8], 35:['--p35',29,7], 25:['--p25',24,6], 15:['--p10',19,5], 10:['--p10',18,5], 5:['--p5',14,4], 2.5:['--p2',11,4], 1.25:['--p2',9,3] };
  const K = { 25:['--p55',34,8], 20:['--p45',34,8], 15:['--p35',29,7], 10:['--p25',24,6], 5:['--p10',18,5], 2.5:['--p5',14,4], 2:['--p5',13,4], 1.25:['--p2',11,3], 1:['--p2',10,3], 0.5:['--p2',9,3] };
  const m = (lbs ? L : K)[p];
  if (m) return { c: m[0], h: m[1], w: m[2] };
  return { c: '--p5', h: Math.max(9, Math.min(34, 9 + p * (lbs ? 0.55 : 1.2))), w: 4 };
}
function plateViz(weight) {
  if (!S.settings.plateViz) return '';
  const unit = S.settings.unit;
  const pl = platesFor(weight);
  if (pl.below) return `<div class="plates"><span class="ptext">Below bar weight</span></div>`;
  if (!pl.list.length && !pl.rem) return `<div class="plates"><span class="ptext">Empty bar</span></div>`;
  const H = 36, mid = H / 2;
  let x = 0, parts = [];
  parts.push(`<rect x="0" y="${mid - 7}" width="5" height="14" rx="1.5" style="fill:var(--sleeve)"/>`);
  x = 7;
  for (const p of pl.list) {
    const s = plateStyle(p);
    const stroke = s.c === '--p10' ? ' stroke:var(--line-strong);stroke-width:1;' : '';
    parts.push(`<rect x="${x}" y="${mid - s.h / 2}" width="${s.w}" height="${s.h}" rx="1.8" style="fill:var(${s.c});${stroke}"/>`);
    x += s.w + 1.5;
  }
  const sleeveEnd = x + 10;
  parts.unshift(`<rect x="3" y="${mid - 2.5}" width="${sleeveEnd - 3}" height="5" rx="2" style="fill:var(--sleeve)"/>`);
  const text = pl.list.map(fmt).join(' ') + (pl.rem ? ` +${fmt(pl.rem)}` : '');
  return `<div class="plates"><svg width="${sleeveEnd}" height="${H}" viewBox="0 0 ${sleeveEnd} ${H}" aria-hidden="true">${parts.join('')}</svg><span class="ptext">${esc(text)}<span class="sr"> ${esc(unit)} per side</span></span></div>`;
}

/* ---------- TRAIN ---------- */
function viewTrain() {
  const next = upNext();
  if (!next && !ui.week) {
    return `<div class="finish" style="margin-top:20px"><h2>All ${S.settings.cycles} cycles logged</h2>
      <p class="muted">Add another cycle to keep going. Training maxes keep climbing by your increments.</p>
      <button class="btn primary" data-act="add-cycle">Add a cycle</button></div>`;
  }
  const cur = ui.week || { c: next.c, w: next.w };
  const wk = WEEKS[cur.w - 1];
  const weekId = `${cur.c}|${cur.w}`;
  if (ui.openFor !== weekId) {
    ui.openFor = weekId;
    ui.open = new Set(next && next.c === cur.c && next.w === cur.w ? [key(next.lift.id, cur.c, cur.w)] : []);
  }
  const lifts = liftsOrdered();
  const d0 = sessionDate(lifts[0], cur.c, cur.w), d1 = sessionDate(lifts[lifts.length - 1], cur.c, cur.w);
  const atStart = cur.c === 1 && cur.w === 1, atEnd = cur.c === S.settings.cycles && cur.w === 4;
  const offNext = next && (next.c !== cur.c || next.w !== cur.w);
  let h = `<section class="week-head">
    <button class="icon-btn" data-act="week-prev" aria-label="Previous week" ${atStart ? 'disabled' : ''}>${ICON.left}</button>
    <div class="week-title">
      <div class="cycle-line">Cycle ${cur.c}</div>
      <div class="week-line"><span>Week ${cur.w}</span><span class="scheme">${wk.label}</span></div>
      <div class="dates">${esc(fmtDate(d0, { noWeekday: true }))} to ${esc(fmtDate(d1, { noWeekday: true }))}</div>
    </div>
    <button class="icon-btn" data-act="week-next" aria-label="Next week" ${atEnd ? 'disabled' : ''}>${ICON.right}</button>
  </section>`;
  if (offNext) h += `<div class="back-next"><button class="link-btn" data-act="go-next">Jump to up next: ${esc(next.lift.name)}, cycle ${next.c} week ${next.w}</button></div>`;
  for (const lift of lifts) h += sessionCard(lift, cur.c, cur.w, next);
  return h;
}
function sessionCard(lift, c, w, next) {
  const k = key(lift.id, c, w), e = S.log[k] || {};
  const wk = WEEKS[w - 1];
  const isNext = next && next.lift.id === lift.id && next.c === c && next.w === w;
  const logged = isLogged(e);
  const open = ui.open.has(k);
  const ws = setWeights(S, lift, c, w);
  let summary;
  if (e.reps != null && e.reps !== '' && wk.amrap) {
    const v = entryE1(lift, c, w);
    summary = `<b>${fmt(topWeight(lift, c, w))} × ${esc(e.reps)}</b>${v ? `, e1RM ${r0(v)}` : ''}`;
  } else if (logged) summary = '<b>Done</b>';
  else summary = `Top set <b>${fmt(ws[2])} × ${wk.reps[2]}${wk.amrap ? '+' : ''}</b>`;
  const tag = logged ? `<span class="tag done">Done</span>` : isNext ? `<span class="tag next">Up next</span>` : '';
  return `<article class="session${open ? ' open' : ''}${isNext ? ' is-next' : ''}">
    <button class="session-head" data-act="toggle" data-key="${esc(k)}" aria-expanded="${open}">
      <div><div class="lift-name">${esc(lift.name)}</div>
      <div class="session-sub"><span style="white-space:nowrap">${esc(fmtDate(sessionDate(lift, c, w)))}</span><span class="sum">${summary}</span></div></div>
      <div class="head-right">${tag}${ICON.chev}</div>
    </button>
    ${open ? `<div class="session-body">${sessionBody(lift, c, w)}</div>` : ''}
  </article>`;
}
function sessionBody(lift, c, w) {
  const k = key(lift.id, c, w), e = S.log[k] || {};
  const wk = WEEKS[w - 1];
  const tm = tmFor(S, lift, c);
  const ws = setWeights(S, lift, c, w);
  const step = +S.settings.round;
  let h = `<div class="tm-line">Training max ${fmt(Math.round(tm * 10) / 10)} ${esc(S.settings.unit)}${S.settings.plateViz ? '. Plates are per side.' : ''}</div>`;
  h += `<div class="sets">`;
  if (S.settings.warmups && wk.amrap) {
    h += `<div class="group-label">Warm-up</div>`;
    WARMUP.pcts.forEach((p, i) => {
      const wt = mround(tm * p, step);
      h += `<div class="set-row warm"><span></span><div class="set-w">${fmt(wt)}<span class="x">×</span>${WARMUP.reps[i]}<span class="set-pct">${Math.round(p * 100)}%</span></div>${plateViz(wt)}</div>`;
    });
    h += `<div class="group-label">Work sets</div>`;
  }
  const sets = Array.isArray(e.sets) ? e.sets : [];
  ws.forEach((wt, i) => {
    const last = i === 2;
    const shownW = last && e.w != null ? +e.w : wt;
    const on = !!sets[i];
    h += `<div class="set-row">
      <button class="set-check" data-act="set" data-key="${esc(k)}" data-i="${i}" aria-pressed="${on}" aria-label="Set ${i + 1} complete">${ICON.check}</button>
      <div class="set-w">${fmt(shownW)}<span class="x">×</span>${wk.reps[i]}${last && wk.amrap ? '<span class="plus">+</span>' : ''}<span class="set-pct">${Math.round(wk.pcts[i] * 100)}%${last && wk.amrap ? ', as many reps as possible' : ''}</span></div>
      ${plateViz(shownW)}
    </div>`;
  });
  h += `</div>`;

  if (wk.amrap) {
    const top = topWeight(lift, c, w);
    const best = bestBefore(lift, c, w);
    const has = e.reps != null && e.reps !== '';
    let result;
    if (has) {
      const v = e1rm(top, +e.reps, S.settings.formula);
      if (v == null) result = `No estimate for 0 reps.`;
      else {
        const pr = best != null && v > best + 1e-6;
        result = `Estimated 1RM <span class="big">${r0(v)}</span>${pr ? '<span class="pr">New best</span>' : ''}` +
          (best != null && !pr ? `<br>Best before this session: ${r0(best)}` : '');
      }
    } else if (best != null) {
      const n = repsToBeat(top, best);
      result = n ? `Hit <b>${n}</b> rep${n === 1 ? '' : 's'} or more at ${fmt(top)} to beat your best estimated 1RM (${r0(best)}).` : `Your best estimated 1RM is ${r0(best)}.`;
    } else {
      result = `Log your reps here to start tracking estimated 1RM.`;
    }
    h += `<div class="amrap">
      <div class="amrap-top">
        <div class="amrap-label">Reps on the last set<small>${fmt(top)} ${esc(S.settings.unit)}, aim for ${wk.reps[2]} or more</small></div>
        <div class="stepper">
          <button data-act="amrap-dec" data-key="${esc(k)}" aria-label="One rep fewer">−</button>
          <input type="number" inputmode="numeric" min="0" max="50" class="amrap-input" data-key="${esc(k)}" data-fid="amrap-${esc(k)}" value="${has ? esc(e.reps) : ''}" placeholder="–" aria-label="Reps on the last set">
          <button data-act="amrap-inc" data-key="${esc(k)}" aria-label="One rep more">+</button>
        </div>
      </div>
      <div class="amrap-result">${result}</div>
    </div>`;
  }

  const bSets = w === 4 ? (+lift.bbbDeload || 0) : (+lift.bbbSets || 0);
  if (bSets > 0 && +S.settings.bbbPct > 0) {
    const bw = bbbWeight(S, lift, c);
    const done = +e.bbb || 0;
    let dots = '';
    for (let i = 1; i <= bSets; i++) dots += `<button class="bbb-dot${i <= done ? ' on' : ''}" data-act="bbb" data-key="${esc(k)}" data-i="${i}" aria-label="Boring But Big set ${i}" aria-pressed="${i <= done}">${i}</button>`;
    h += `<div class="bbb">
      <div class="bbb-head"><div class="bbb-title">Boring But Big<small>${Math.round(S.settings.bbbPct * 100)}% of training max</small></div>
      <div class="bbb-right"><div class="bbb-w">${fmt(bw)}<span class="x">${bSets} × ${+lift.bbbReps || 10}</span></div>${plateViz(bw)}</div></div>
      <div class="bbb-dots">${dots}</div>
    </div>`;
  }
  h += `<div class="note"><label for="note-${esc(k)}">Notes</label><textarea id="note-${esc(k)}" class="note-input" data-key="${esc(k)}" data-fid="note-${esc(k)}" placeholder="How did it move?">${esc(e.note || '')}</textarea></div>`;
  const hasData = Object.keys(e).some(x => x !== 't');
  h += `<div class="session-foot">
    ${!e.done ? `<button class="btn primary" data-act="done" data-key="${esc(k)}">Mark done</button>` : ''}
    ${hasData ? `<button class="btn quiet danger" data-act="reset-session" data-key="${esc(k)}">Clear session</button>` : ''}
    ${e.date ? `<span class="logged-on">Logged ${esc(fmtDate(parseISO(e.date)))}</span>` : ''}
  </div>`;
  return h;
}

/* ---------- PLAN ---------- */
function viewPlan() {
  const next = upNext();
  const N = S.settings.cycles;
  let c = ui.planC || (next ? next.c : N);
  c = Math.max(1, Math.min(N, c));
  ui.planC = c;
  const lifts = liftsOrdered();
  const d0 = sessionDate(lifts[0], c, 1), d1 = sessionDate(lifts[lifts.length - 1], c, 4);
  let h = `<section class="plan-head">
    <button class="icon-btn" data-act="plan-prev" aria-label="Previous cycle" ${c <= 1 ? 'disabled' : ''}>${ICON.left}</button>
    <div><div class="cycle-line">Cycle ${c} <span class="muted" style="font-size:22px">of ${N}</span></div>
    <div class="dates">${esc(fmtDate(d0, { noWeekday: true }))} to ${esc(fmtDate(d1, { noWeekday: true }))}</div></div>
    <button class="icon-btn" data-act="plan-next" aria-label="Next cycle" ${c >= N ? 'disabled' : ''}>${ICON.right}</button>
  </section>`;
  h += `<div class="plan-wrap"><table class="plan"><thead><tr><th class="sr">Lift</th><th>TM</th>`;
  WEEKS.forEach(wk => { h += `<th><span aria-hidden="true">Wk ${wk.n}</span><span class="sr">Week ${wk.n}</span><small>${wk.label}</small></th>`; });
  h += `</tr></thead><tbody>`;
  for (const lift of lifts) {
    const tm = tmFor(S, lift, c);
    const ov = S.tm[`${lift.id}|${c}`];
    const hasOv = ov != null && ov !== '';
    h += `<tr><th class="lift" scope="row">${esc(lift.name)}<small>${DAYS[+lift.dow] || ''}</small></th>
      <td><div class="tm-cell"><input class="tm-input${hasOv ? ' override' : ''}" type="number" inputmode="decimal" step="any" data-id="${esc(lift.id)}" data-c="${c}" data-fid="tm-${esc(lift.id)}-${c}" value="${fmt(Math.round(tm * 10) / 10)}" aria-label="${esc(lift.name)} training max, cycle ${c}">
      ${hasOv ? `<button class="tm-reset" data-act="tm-auto" data-id="${esc(lift.id)}" data-c="${c}">Auto</button>` : ''}</div></td>`;
    for (let w = 1; w <= 4; w++) {
      const e = S.log[key(lift.id, c, w)];
      const isNext = next && next.lift.id === lift.id && next.c === c && next.w === w;
      const top = topWeight(lift, c, w);
      let res = '';
      if (e && e.reps != null && e.reps !== '' && w < 4) res = `×${esc(e.reps)}`;
      else if (isLogged(e)) res = 'Done';
      h += `<td><button class="cell${isLogged(e) ? ' logged' : ''}${isNext ? ' is-next' : ''}" data-act="plan-cell" data-id="${esc(lift.id)}" data-c="${c}" data-w="${w}" aria-label="${esc(lift.name)} week ${w}, top set ${fmt(top)}${res ? ', ' + res : ''}"><span class="cw">${fmt(top)}</span><span class="cr">${res || '&nbsp;'}</span></button></td>`;
    }
    h += `</tr>`;
  }
  h += `</tbody></table></div>`;
  const bbbLine = lifts.map(l => `${esc(l.name)} <b>${fmt(bbbWeight(S, l, c))}</b>`).join(', ');
  h += `<p class="plan-notes">Cells show the top set for each week; tap one to open it. Boring But Big this cycle: ${bbbLine}.</p>
    <p class="plan-notes">Training maxes go up by your increment each cycle. Type a new number to reset a lift from this cycle on; tap Auto to undo.</p>`;
  const lastCycleEmpty = !Object.keys(S.log).some(k => { const p = k.split('|'); return +p[1] === N && isLogged(S.log[k]); });
  h += `<div class="plan-actions">
    <button class="btn" data-act="add-cycle">Add a cycle</button>
    ${N > 1 && lastCycleEmpty ? `<button class="btn quiet" data-act="remove-cycle">Remove cycle ${N}</button>` : ''}
  </div>`;
  return h;
}

/* ---------- PROGRESS ---------- */
function liftSeries(lift) {
  const pts = [];
  for (let c = 1; c <= S.settings.cycles; c++) for (let w = 1; w <= 3; w++) {
    const v = entryE1(lift, c, w);
    if (v != null) pts.push({ c, w, x: (c - 1) * 3 + (w - 1), y: v, wt: topWeight(lift, c, w), reps: +S.log[key(lift.id, c, w)].reps });
  }
  return pts;
}
function progressCycles() {
  const next = upNext();
  let maxC = next ? next.c : S.settings.cycles;
  for (const k of Object.keys(S.log)) { const p = k.split('|'); if (isLogged(S.log[k])) maxC = Math.max(maxC, +p[1]); }
  return Math.max(2, Math.min(S.settings.cycles, maxC));
}
function viewProgress() {
  if (!ui.lift || !S.lifts.some(l => l.id === ui.lift)) {
    const withData = S.lifts.find(l => liftSeries(l).length);
    ui.lift = (withData || S.lifts[0]).id;
  }
  let h = `<h1 class="view-title">Progress</h1><div class="tiles" role="group" aria-label="Choose a lift">`;
  for (const lift of S.lifts) {
    const pts = liftSeries(lift);
    let val = '–', sub = 'No sets logged yet';
    if (pts.length) {
      const best = Math.max(...pts.map(p => p.y)), first = pts[0].y;
      val = r0(best);
      if (pts.length === 1) sub = '1 set logged';
      else {
        const d = best - first;
        sub = d > 0.5 ? `<span class="up">+${r0(d)}</span> since cycle ${pts[0].c}` : `${pts.length} sets logged`;
      }
    }
    h += `<button class="tile" data-act="prog-lift" data-id="${esc(lift.id)}" aria-pressed="${ui.lift === lift.id}">
      <div class="tile-name">${esc(lift.name)}</div><div class="tile-val">${val}${pts.length ? '<small>best e1RM</small>' : ''}</div><div class="tile-sub">${sub}</div></button>`;
  }
  h += `</div>`;
  const lift = S.lifts.find(l => l.id === ui.lift);
  const pts = liftSeries(lift);
  h += `<section class="panel" style="margin-top:12px">
    <div class="chart-head"><div class="chart-title">${esc(lift.name)}: estimated 1RM by session<small>From reps on the last set of weeks 1 to 3</small></div>
    <div class="legend" aria-hidden="true"><span><i></i>Estimated 1RM</span><span><i class="tm"></i>Training max</span></div></div>
    ${pts.length ? `<div class="chart-wrap" id="chart"></div>` : `<div class="empty">Nothing logged for ${esc(lift.name)} yet. Enter reps on the last set in Train and your estimated 1RM shows up here.</div>`}
  </section>`;

  const maxC = progressCycles();

function niceTicks(min, max, count) {

  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;

}

function setField(el) {
  const path = el.dataset.field.split('.');
  const type = el.dataset.type;
  let v;
  if (type === 'bool') v = el.checked;
  else if (type === 'num') { v = num(el.value); if (v == null) { requestRender(); return; } }
  else if (type === 'int') { v = num(el.value); if (v == null) { requestRender(); return; } v = Math.round(v); }
  else if (type === 'pct') { v = num(el.value); if (v == null) { requestRender(); return; } v = v / 100; }
  else if (type === 'list') { v = el.value.split(/[,\s]+/).map(Number).filter(n => n > 0); }
  else if (type === 'date') { if (!/^\d{4}-\d{2}-\d{2}$/.test(el.value)) { requestRender(); return; } v = el.value; }
  else if (type === 'unit') {
    const old = S.settings.unit; v = el.value;
    if (v !== old) {
      if (JSON.stringify(S.settings.plates) === JSON.stringify(PLATE_DEFAULTS[old])) S.settings.plates = PLATE_DEFAULTS[v].slice();
      if (+S.settings.bar === BAR_DEFAULTS[old]) S.settings.bar = BAR_DEFAULTS[v];
      if (+S.settings.round === ROUND_DEFAULTS[old]) S.settings.round = ROUND_DEFAULTS[v];
    }
  }
  else v = el.value;
  let obj = S;
  for (let i = 0; i < path.length - 1; i++) obj = obj[path[i]];
  obj[path[path.length - 1]] = v;
  const section = path[0];
  const fullRender = el.tagName === 'SELECT' || type === 'bool' || type === 'unit';
  commit(section, { silent: !fullRender });
  if (!fullRender) {
    document.querySelectorAll('[data-derived]').forEach(d => { const i = +d.dataset.derived.split('-')[1]; d.textContent = derivedLift(i); });
    $('#brand-title').textContent = S.settings.title || '5/3/1';
  }
}

function weekShift(d) {
  const next = upNext();
  const cur = ui.week || (next ? { c: next.c, w: next.w } : { c: S.settings.cycles, w: 4 });
  let i = (cur.c - 1) * 4 + (cur.w - 1) + d;
  i = Math.max(0, Math.min(S.settings.cycles * 4 - 1, i));
  ui.week = { c: Math.floor(i / 4) + 1, w: (i % 4) + 1 };
  if (next && ui.week.c === next.c && ui.week.w === next.w) ui.week = null;
  render();
  window.scrollTo({ top: 0 });
}

  const lift = S.lifts.find(l => l.id === id);
  const before = bestBefore(lift, +c, +w);
  updateEntry(k, e => {
    if (reps == null) { delete e.reps; delete e.w; return; }
    e.reps = reps;
    if (e.w == null) e.w = setWeights(S, lift, +c, +w)[2];
    if (!e.date) e.date = todayISO();
  });
  if (reps != null && before != null) {
    const v = entryE1(lift, +c, +w);
    if (v != null && v > before + 1e-6) toast(`New best ${lift.name}: e1RM ${r0(v)}`, 'pr');
  }
}

    if (!confirm('Clear every logged session and body weight? Settings and lifts stay.')) return;
    const now = Date.now();
    for (const k of Object.keys(S.log)) S.log[k] = { t: now };
    S.bw = {}; commit('bw'); ui.week = null; ui.openFor = null; toast('Log cleared');
  },
  'sync-connect': async () => {
    const t = ($('#sync-token') || {}).value || '';

    await Sync.connect(t.trim());

  'sync-now': () => Sync.run(true),
  'sync-disconnect': () => {

function stampAll(st) {
  const now = Date.now();
  st.updatedAt = now;
  Object.keys(st.t).forEach(k => st.t[k] = now);
  Object.values(st.log).forEach(e => e.t = now);
  return st;
}
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function toCSV() {
  const rows = [['cycle','week','lift','scheduled_date','training_max','set1','set2','set3','amrap_reps','est_1rm','bbb_weight','bbb_sets_done','done','logged_on','note']];
  for (const s of sequence()) {
    const e = S.log[key(s.lift.id, s.c, s.w)] || {};
    const ws = setWeights(S, s.lift, s.c, s.w);
    if (e.w != null) ws[2] = +e.w;
    const v = entryE1(s.lift, s.c, s.w);
    const d = sessionDate(s.lift, s.c, s.w);
    rows.push([s.c, s.w, s.lift.name, `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, Math.round(tmFor(S, s.lift, s.c) * 10) / 10,
      ws[0], ws[1], ws[2], e.reps ?? '', v != null ? Math.round(v * 100) / 100 : '', bbbWeight(S, s.lift, s.c), e.bbb ?? '', isLogged(e) ? 'yes' : '', e.date || '', e.note || '']);
  }
  return rows.map(r => r.map(v => { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\n');
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.matches('[data-field]')) return setField(el);
  if (el.matches('.amrap-input')) { const v = num(el.value); return setReps(el.dataset.key, v == null ? null : Math.max(0, Math.min(50, Math.round(v)))); }
  if (el.matches('.note-input')) return updateEntry(el.dataset.key, e => { e.note = el.value.trim(); });
  if (el.matches('.tm-input')) {
    const v = num(el.value), k = `${el.dataset.id}|${el.dataset.c}`;
    if (v == null || v <= 0) delete S.tm[k]; else S.tm[k] = v;
    return commit('tm');
  }
  if (el.matches('.bw-input')) {
    const v = num(el.value);
    if (v == null || v <= 0) delete S.bw[el.dataset.c]; else S.bw[el.dataset.c] = v;
    return commit('bw');
  }
  if (el.id === 'import-file' && el.files && el.files[0]) {
    const f = el.files[0];
    f.text().then(text => {
      let d; try { d = JSON.parse(text); } catch (e) { toast('That file is not a backup from this app'); return; }
      if (!validShape(d)) { toast('That file is not a backup from this app'); return; }
      if (!confirm('Replace the data on this device with this backup?')) return;
      S = stampAll(normalize(d)); persist(); ui.week = null; ui.openFor = null; render(); Sync.schedule(); toast('Backup restored');
    }).finally(() => { el.value = ''; });
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches('#sync-token')) { ev.preventDefault(); actions['sync-connect'](); }
});
function routeFromHash() {
  const t = (location.hash || '#train').slice(1);
  ui.tab = ['train', 'plan', 'progress', 'settings'].includes(t) ? t : 'train';
  render();
  window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', routeFromHash);
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (ui.tab === 'progress') drawChart(); }, 150); });

/* ============================================================
   Sync: one secret gist on the user's GitHub account.
   Each logged session carries its own timestamp, so edits from
   two devices merge session by session; settings, lifts, TM
   overrides and body weights take the most recently changed copy.
   ============================================================ */
const GIST_FILE = '531-tracker-data.json';
const GIST_DESC = '5/3/1 tracker data (kept in sync by the 5/3/1 Tracker web app)';
function sortKeys(v) {
  if (Array.isArray(v)) return v.map(sortKeys);
  if (v && typeof v === 'object') { const o = {}; Object.keys(v).sort().forEach(k => { o[k] = sortKeys(v[k]); }); return o; }
  return v;
}
const stable = v => JSON.stringify(sortKeys(v));
function mergeStates(a, b) {
  const out = clone(a);
  for (const sec of ['settings', 'lifts', 'tm', 'bw']) {
    if ((b.t && b.t[sec] || 0) > (a.t && a.t[sec] || 0)) { out[sec] = clone(b[sec]); out.t[sec] = b.t[sec]; }
  }
  out.log = {};
  const keys = new Set([...Object.keys(a.log || {}), ...Object.keys(b.log || {})]);
  for (const k of keys) {
    const ea = a.log[k], eb = b.log[k];
    out.log[k] = !ea ? clone(eb) : !eb ? clone(ea) : ((eb.t || 0) > (ea.t || 0) ? clone(eb) : clone(ea));
  }
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return out;
}
const Sync = {
  cfg: (() => { try { return JSON.parse(localStorage.getItem(LS_SYNC)) || {}; } catch (e) { return {}; } })(),
  status: 'off', busy: false, again: false, timer: null,
  on() { return !!this.cfg.token; },
  save() { try { localStorage.setItem(LS_SYNC, JSON.stringify(this.cfg)); } catch (e) {} },
  async api(path, opts = {}) {
    const headers = { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${this.cfg.token}` };
    if (opts.body) headers['Content-Type'] = 'application/json';
    const res = await fetch('https://api.github.com' + path, Object.assign({}, opts, { headers }));
    if (!res.ok) {
      const msg = res.status === 401 ? 'GitHub rejected the token. Create a new one with gist access and connect again.'
        : res.status === 403 ? 'GitHub refused the request. Check that the token has gist access.'
        : res.status === 404 ? 'not found' : `GitHub returned an error (${res.status}).`;
      const err = new Error(msg); err.status = res.status; throw err;
    }
    return res.status === 204 ? null : res.json();
  },
  async locate() {
    for (let page = 1; page <= 5; page++) {
      const list = await this.api(`/gists?per_page=100&page=${page}&_=${Date.now()}`);
      const g = list.find(x => x.files && x.files[GIST_FILE]);
      if (g) { this.cfg.gistId = g.id; this.save(); return false; }
      if (list.length < 100) break;
    }
    const g = await this.api('/gists', { method: 'POST', body: JSON.stringify({ description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: JSON.stringify(S, null, 1) } } }) });
    this.cfg.gistId = g.id; this.save();
    return true;
  },
  async pull() {
    const g = await this.api(`/gists/${this.cfg.gistId}?_=${Date.now()}`);
    const f = g.files && g.files[GIST_FILE];
    if (!f) return null;
    let text = f.content;
    if (f.truncated && f.raw_url) text = await (await fetch(f.raw_url)).text();
    try { const d = JSON.parse(text); return validShape(d) ? normalize(d) : null; } catch (e) { return null; }
  },
  async push(st) {
    await this.api(`/gists/${this.cfg.gistId}`, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(st, null, 1) } } }) });
  },
  schedule() { if (!this.on()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 1200); },
  async connect(token) {
    this.cfg = { token };
    this.status = 'busy'; render();
    try {
      const u = await this.api('/user');
      this.cfg.login = u.login; this.save();
      await this.run();
      if (!this.cfg.err) toast('Sync is on');
    } catch (e) {
      this.cfg = {}; this.save(); this.status = 'off'; render();
      toast(e.status ? e.message : 'Could not reach GitHub. Check your connection and try again.');
    }
  },
  async run(manual) {
    if (!this.on()) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.setStatus('busy');
    try {
      if (!this.cfg.gistId) await this.locate();
      let remote;
      try { remote = await this.pull(); }
      catch (e) { if (e.status !== 404) throw e; this.cfg.gistId = null; await this.locate(); remote = await this.pull(); }
      const merged = remote ? mergeStates(S, remote) : S;
      if (stable(merged) !== stable(S)) { S = merged; persist(); requestRender(); }
      if (!remote || stable(merged) !== stable(remote)) await this.push(merged);
      this.cfg.last = Date.now(); this.cfg.err = null; this.save();
      this.setStatus('ok');
      if (manual) toast('Synced');
    } catch (e) {
      this.cfg.err = e && e.status ? e.message : (navigator.onLine === false
        ? 'Offline. Changes are saved on this device and sync when you are back online.'
        : 'Could not reach GitHub. Changes are saved on this device.');
      this.save(); this.setStatus('err');
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; this.run(); }
    }
  },
  setStatus(s) {
    this.status = s;
    updateSyncIndicator();
    const a = document.activeElement;
    if (ui.tab === 'settings' && !(a && a.matches && a.matches('input,textarea,select'))) requestRender();
  },
};
function updateSyncIndicator() {
  const pill = $('#sync-pill'), dot = $('#sync-dot'), text = $('#sync-text'), sd = $('#settings-dot');
  const on = Sync.on();
  pill.classList.toggle('show', on);
  const err = on && !!Sync.cfg.err && Sync.status !== 'busy';
  sd.classList.toggle('show', err);
  if (!on) return;
  dot.className = 'dot ' + (Sync.status === 'busy' ? 'busy' : err ? 'err' : 'ok');
  text.textContent = Sync.status === 'busy' ? 'Syncing' : err ? 'Not synced' : 'Synced';
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Sync.on() && Date.now() - (Sync.cfg.last || 0) > 15000) Sync.run();
});
window.addEventListener('online', () => { if (Sync.on()) Sync.run(); });

/* ---------- boot ---------- */
routeFromHash();
if (Sync.on()) Sync.run();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
